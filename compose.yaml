services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeroshare
      POSTGRES_USER: zeroshare
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroshare -d zeroshare"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zeroshare-local
      MINIO_ROOT_PASSWORD: zeroshare-local-demo-only
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: "mc alias set local http://minio:9000 zeroshare-local zeroshare-local-demo-only && mc mb --ignore-existing local/zeroshare-ciphertext"

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    environment:
      IDENTITY_PORT: 4001
      IDENTITY_ISSUER: http://localhost:4001
      ALLOWED_REDIRECT_ORIGINS: http://localhost:5175
    ports: ["4001:4001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    environment:
      API_PORT: 4000
      ALLOW_INSECURE_DEMO: "true"
      IDENTITY_ISSUER: http://identity:4001
      ALLOWED_REDIRECT_ORIGINS: http://localhost:5175
      OBJECT_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zeroshare-ciphertext
      S3_ACCESS_KEY: zeroshare-local
      S3_SECRET_KEY: zeroshare-local-demo-only
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_IDENTITY_ISSUER: http://localhost:4001
    depends_on:
      api:
        condition: service_healthy
    ports: ["5175:8080"]

volumes:
  postgres_data:
  minio_data:
